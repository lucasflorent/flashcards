<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Vrai ou Faux - Flashcards</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/css/style.css?v=12">
</head>
<body class="page-jeu">
<header class="entete">
  <h1>Vrai ou Faux</h1>
  <div class="controle-taille">
    <label for="curseur-taille">Taille des images</label>
    <input type="range" id="curseur-taille" min="50" max="400" step="10" value="100">
    <span id="valeur-taille" class="valeur-taille">100 %</span>
  </div>
  <div class="controle-taille">
    <label for="curseur-texte">Taille du texte</label>
    <input type="range" id="curseur-texte" min="50" max="400" step="10" value="100">
    <span id="valeur-texte" class="valeur-taille">100 %</span>
  </div>
  <nav><a id="lien-retour" href="../">← Menu des jeux</a></nav>
</header>
<main class="conteneur">
  <section id="ecran-configuration">
    <h2>Ensemble : <span id="nom-ensemble"></span></h2>
    <div id="zone-selecteur"></div>
    <button id="bouton-demarrer">Démarrer</button>
    <p id="erreur-chargement" class="message-erreur" hidden></p>
  </section>

  <section id="ecran-jeu" hidden>
    <p class="aide">Une image s'affiche avec un mot, parfois juste, parfois faux. Les élèves répondent "Vrai" ou "Faux" à l'oral, puis cliquez sur "Révéler".</p>

    <div class="zone-carte">
      <img id="image-carte" alt="">
      <p id="mot-propose" class="mot-carte"></p>
    </div>
    <p id="resultat-vf" class="statut-jeu" hidden></p>

    <div class="commandes-jeu">
      <button id="bouton-reveler">Révéler</button>
      <button id="bouton-suivante">Carte suivante →</button>
    </div>
    <p id="compteur-cartes" class="statut-jeu"></p>

    <div class="commandes-jeu">
      <button id="bouton-rejouer" class="bouton-secondaire" hidden>Rejouer (même sélection)</button>
      <button id="bouton-recommencer" class="bouton-secondaire">Changer les cartes</button>
    </div>
  </section>
</main>
<script src="../assets/js/game-common.js?v=12"></script>
<script src="../assets/js/jeu-vraifaux.js?v=12"></script>
</body>
</html>
